<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quoridor Bridge</title>
<style>
:root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #23201b; --muted: #7a7266; --line: #ddd5c6; --ok: #2e8b57; --err: #d6453d; }
@media (prefers-color-scheme: dark) { :root { --bg: #17150f; --panel: #211e16; --ink: #ece6d8; --muted: #9a917f; --line: #38332a; --ok: #5bbf85; --err: #f0645b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 32px; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; min-width: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; }
button { font: inherit; padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.msg { height: 1.4em; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
.cur { font-size: 13px; color: var(--muted); height: 2.9em; overflow: hidden; overflow-wrap: anywhere; }
.last { font-variant-numeric: tabular-nums; font-size: 14px; height: 4.3em; overflow: hidden; overflow-wrap: anywhere; }
.last small { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quoridor Bridge <span>бот для barricade.gg</span></h1>
  <div class="card">
    <label>Бот (спецификация и теги)<div id="bot"></div></label>
    <div class="row">
      <label>Мс на ход (0 = по глубине)<input id="ms" type="number" min="0" max="120000" step="100"></label>
      <label>Глубина (если мс = 0)<input id="depth" type="number" min="0" max="14"></label>
    </div>
    <div><button id="apply" class="primary">Применить</button></div>
    <div class="msg" id="msg"></div>
    <div class="cur" id="cur"></div>
  </div>
  <div class="card">
    <div style="font-size:12px;color:var(--muted)">Последний ход</div>
    <div class="last" id="last">Ходов пока не было</div>
  </div>
</div>
<script src="/picker.js"></script>
<script>
const $ = id => document.getElementById(id);
let picker = null, dirty = false;
const say = (t, cls) => { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); };

async function api(body) {
  const r = await fetch("/api/config", body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return r.json();
}
function fmtScore(v) {
  if (v === undefined || v === null) return "";
  if (Math.abs(v) > 29000) return (v > 0 ? "мат +" : "мат −") + (30000 - Math.abs(v));
  return (v > 0 ? "+" : "") + (v / 100).toFixed(1);
}
function show(c, setForm) {
  $("cur").textContent = `Сейчас: ${c.bot} · ${c.ms ? c.ms + " мс" : "глубина " + c.depth}`;
  if (setForm) { picker.value = c.bot; $("ms").value = c.ms; $("depth").value = c.depth; }
  const l = c.last;
  $("last").innerHTML = !l ? "Ходов пока не было" :
    `<b>${l.move}</b> · глубина ${l.depth} · ${l.ms.toFixed(0)} мс · ${l.nodes.toLocaleString("ru")} узлов` +
    (l.score != null ? ` · оценка ${fmtScore(l.score)}` : "") + (l.fromBook ? " · книга" : "") +
    `<br><small>№${l.n} в ${l.at}` + (l.starts ? ` · угадано ходов соперника ${l.hits} из ${l.starts}` : "") + `</small>`;
}
async function poll() {
  try { show(await api(), false); } catch (e) { /* сервер перезапускают */ }
}
(async () => {
  picker = await createPicker($("bot"), { value: "v2", human: false, onchange: () => { dirty = true; say("Не применено", ""); } });
  const c = await api();
  show(c, true);
  dirty = false; say("");
  $("apply").onclick = async () => {
    const r = await api({ bot: picker.value, ms: +$("ms").value || 0, depth: +$("depth").value || 0 });
    if (r.error) { say(r.error, "err"); return; }
    dirty = false; say("Применено: бот и история партии сброшены", "ok"); show(r, false);
  };
  ["ms", "depth"].forEach(id => $(id).addEventListener("input", () => { dirty = true; say("Не применено", ""); }));
  setInterval(poll, 1500);
})();
</script>
</body>
</html>
